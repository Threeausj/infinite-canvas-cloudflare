server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ^~ /api/jobs/ {
        proxy_pass ${CANVAS_JOBS_UPSTREAM}/jobs/;
        include /etc/nginx/snippets/canvas-api-proxy.conf;
    }

    location ^~ /api/v1/ {
        proxy_pass ${CANVAS_API_UPSTREAM}/v1/;
        include /etc/nginx/snippets/canvas-api-proxy.conf;
    }

    location ^~ /api/v1beta/ {
        proxy_pass ${CANVAS_API_UPSTREAM}/v1beta/;
        include /etc/nginx/snippets/canvas-api-proxy.conf;
    }

    location = /api {
        return 404;
    }

    location /api/ {
        return 404;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'self' ${CANVAS_FRAME_ANCESTORS}" always;
        try_files $uri $uri/ /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
